name: AI Receipt Extractor CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to evaluate (openrouter or huggingface)"
        required: true
        default: "openrouter"
        type: choice
        options:
          - openrouter
          - huggingface
      use_opencv:
        description: "Enable OpenCV preprocessing"
        required: true
        default: false
        type: boolean

jobs:
  lint-and-test:
    name: Validate Code & Run PyTest Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements.txt

      - name: Verify Python syntax & core module imports
        run: |
          python -m py_compile schemas.py image_processor.py parser.py app.py benchmark.py
          python -c "from schemas import ReceiptData, LineItem; from image_processor import preprocess_receipt; print('Core modules verified!')"

      - name: Run PyTest Receipt Extraction Suite
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          PROVIDER="${{ github.event.inputs.provider || 'openrouter' }}"
          OPENCV_FLAG=""
          if [ "${{ github.event.inputs.use_opencv }}" = "true" ]; then
            OPENCV_FLAG="--opencv"
          fi

          if [ "$PROVIDER" = "openrouter" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY secret is not configured. Skipping live API extraction test."
            exit 0
          fi

          pytest -v -s --provider="$PROVIDER" $OPENCV_FLAG